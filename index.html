<!DOCTYPE html>
<html> 
  <head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aasha Dave's links</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>

    <style>
      * {
      border: 1px red dashed;
      }
    
      html {
        min-height: 100%;
      }

      body {
        min-height: 100%;
        padding-top: 40px; 
        padding-bottom: 40px; 
        background: radial-gradient(circle at 100% 0%, #a0d9f2, #8dded2, #9ddda7, #c0d57f, #e3c978, #fcbb9e, #ffb0d2, #f7b0ff);
        font-family: "Georgia"; 
        font-size: 24px; 
        font-weight: 900; 
      }

      .avatar-image {
        width: 128px; 
        height: 128px;
        object-fit: cover;
        object-position: center 20%;
        border-radius: 128px;
      }

      .thumbnail {
        width: 48px; 
        height: 48px; 
        border-radius: 48px; 
        object-fit: cover;
      }

      .item {
        background-color: rgba(250, 193, 245, 0.92)
      }

      .item {
        border-radius: 1000px; 
        padding: 5px; 
        padding-right: 53px; 
        box-shadow: 4px 4px 10px 0px rgba(122,32,122,0.5); 
      }

      .item { 
        margin-bottom: 20px; 
        display: flex; 
        align-items: center;
      }

      .main-container {
        max-width: 640px; 
        margin: auto;
      }

      .image-row {
        margin-bottom: 20px; 
        text-align: center;
      }

      .name-row {
        margin-bottom: 30px; 
        text-align: center;
      }

      .social-icons-row {
        margin-bottom: 30px; 
        display: flex; 
        justify-content: space-around;
      }

      .link-text {
        text-align: center; 
        flex-grow: 1;
      }
    </style>
    
  </head>

  <body>
    <div class="main-container">
      <div class="image-row">
        <img class="avatar-image" src="/thumbnails/Aasha Dave Headshot copy.jpeg" alt="Aasha Dave headshot">
      </div>

      <div class="name-row">
        Aasha Dave
      </div>

      <div class="social-icons-row">
        <a href="https://www.linkedin.com/in/aashadave" target="_blank">
          <i class="fa-brands fa-linkedin"></i> 
        </a>

        <a href="https://www.instagram.com/aasha_dave/" target="_blank">
          <i class="fa-brands fa-square-instagram"></i> 
        </a>
      </div>

      <div class="links-row">
        <div class="item">
          <img class="thumbnail" src="/thumbnails/NYC.jpg" alt="New York City">

          <a class="link-text" target="_blank" href="https://www.nytimes.com/interactive/2026/dining/best-nyc-restaurants.html">
            The 100 Best Restaurants in New York City in 2026
          </a>
       </div>

      <div class="item">
        <img class="thumbnail" src="/thumbnails/Map.jpg" alt="MapTap">

          <a class="link-text" target="_blank" href="https://maptap.gg/">
            MapTap
          </a>
      </div>

      <div class="item">
        <img class="thumbnail" src="/thumbnails/Blog.jpg" alt="Noah Nomad Blog">

          <a class="link-text" target="_blank" href="https://www.noahnomad.com/">
            Noah Nomad
          </a>
        </div>

    </div> <!-- links row -->
  </div> <!-- main-container -->
  </body>

</html>
